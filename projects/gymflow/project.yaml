# REQUIRED. The ONE git repository to scan, as an https:// URL.
repo: https://github.com/Ganesamurthi-V/Gym-Management-System

# REQUIRED. Who should we email our reports to, and use as the primary contact for questions.
primary_contact: support@gymflow.sbs

# Optional. The project's home page.
homepage: https://gymflow.sbs

# REQUIRED. The Dockerfile lives in the repository, as recommended.
dockerfile: .oss-scanner/Dockerfile

# Optional, but strongly recommended. The threat model lives in the repository, as recommended.
threat_model: .oss-scanner/threat_model.md
